name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
        working-directory: .
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Durchstich im Browser gegen den Demo-Server
        run: |
          pip install -r ../backend/requirements.txt
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          (cd ../backend && python scripts/demo_server.py 8765 > /tmp/demo.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/api/health > /dev/null && break; sleep 1; done
          node e2e/smoke.mjs http://127.0.0.1:8765 || { cat /tmp/demo.log; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wlo-data-analysis:ci .
      - name: Start ohne Passwort muss abbrechen
        run: |
          if docker run --rm wlo-data-analysis:ci; then
            echo "Container ist ohne WDA_ADMIN_PASSWORD gestartet" >&2
            exit 1
          fi
      - name: Health-Check
        run: |
          docker run -d --name wda -p 8080:8080 -e WDA_ADMIN_PASSWORD=ci-passwort wlo-data-analysis:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health || { docker logs wda; exit 1; }
      - name: Oberfläche ist im Image
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<app-root>'
          script=$(curl -fsS http://127.0.0.1:8080/ | grep -o 'main-[A-Za-z0-9_-]*\.js' | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:8080/$script"
