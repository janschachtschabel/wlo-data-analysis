# Lokal: Image aus diesem Ordner bauen und ohne Traefik auf http://localhost:8080 starten
# (anderer Port: WDA_PORT in der .env).
#   docker compose -f docker-compose.build.yml up --build
# Das Admin-Passwort steht danach im Datenvolume:
#   docker compose -f docker-compose.build.yml exec app cat /data/admin.password
services:
  init:
    build: .
    image: wlo-data-analysis:local
    command: ["python", "-m", "wda.init"]
    restart: "no"
    environment:
      WDA_ADMIN_PASSWORD: ${WDA_ADMIN_PASSWORD:-}
    volumes:
      - wda-data:/data

  app:
    build: .
    image: wlo-data-analysis:local
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
        restart: true
    env_file:
      - path: .env
        required: false
    environment:
      WDA_ADMIN_PASSWORD_FILE: /data/admin.password
      WDA_COOKIE_SECURE: ${WDA_COOKIE_SECURE:-false}
      WDA_PORT: ${WDA_PORT:-8080}
    ports:
      - "${WDA_PORT:-8080}:${WDA_PORT:-8080}"
    volumes:
      - wda-data:/data

volumes:
  wda-data:
