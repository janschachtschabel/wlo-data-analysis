# Produktiv-Stack für den Docker Manager von Hostinger ("Compose from URL") und jeden Host
# mit Traefik. Der erste Start gelingt ohne jede Variable: Das Admin-Passwort entsteht im
# Datenvolume (anzeigen: docker compose exec app cat /data/admin.password).
# Ohne Domain: HOST_PORT=8090 und TRAEFIK_ENABLE=false, dann http://<server>:8090.
# Lokal bauen und ohne Traefik starten: docker compose -f docker-compose.build.yml up
services:
  init:
    image: ${WDA_IMAGE:-ghcr.io/janschachtschabel/wlo-data-analysis:latest}
    pull_policy: always
    command: ["python", "-m", "wda.init"]
    restart: "no"
    environment:
      DOMAIN: ${DOMAIN:-}
      WDA_ADMIN_PASSWORD: ${WDA_ADMIN_PASSWORD:-}
    volumes:
      - wda-data:/data

  app:
    image: ${WDA_IMAGE:-ghcr.io/janschachtschabel/wlo-data-analysis:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
        restart: true
    environment:
      WDA_ADMIN_PASSWORD: ${WDA_ADMIN_PASSWORD:-}
      WDA_ADMIN_PASSWORD_FILE: /data/admin.password
      WDA_PORT: ${WDA_PORT:-8080}
      WDA_VIEWER_PASSWORD: ${WDA_VIEWER_PASSWORD:-}
      WDA_COOKIE_SECURE: ${WDA_COOKIE_SECURE:-auto}
      WDA_PUBLIC_URL: ${WDA_PUBLIC_URL:-}
      WDA_TIMEZONE: ${WDA_TIMEZONE:-Europe/Berlin}
      WDA_LLM_BASE_URL: ${WDA_LLM_BASE_URL:-https://api.openai.com/v1}
      WDA_LLM_MODEL: ${WDA_LLM_MODEL:-}
      WDA_LLM_API_KEY: ${WDA_LLM_API_KEY:-}
      WDA_LLM_SETTINGS_UI: ${WDA_LLM_SETTINGS_UI:-true}
      WDA_INSTANCES: ${WDA_INSTANCES:-}
      WDA_SNAPSHOT_NIGHTLY: ${WDA_SNAPSHOT_NIGHTLY:-03:30}
      WDA_PRECOMPUTE: ${WDA_PRECOMPUTE:-builtin-themen}
      WDA_SMTP_HOST: ${WDA_SMTP_HOST:-}
      WDA_SMTP_PORT: ${WDA_SMTP_PORT:-587}
      WDA_SMTP_USER: ${WDA_SMTP_USER:-}
      WDA_SMTP_PASSWORD: ${WDA_SMTP_PASSWORD:-}
      WDA_SMTP_FROM: ${WDA_SMTP_FROM:-}
      WDA_SMTP_SECURITY: ${WDA_SMTP_SECURITY:-starttls}
      WDA_SCHEDULER: ${WDA_SCHEDULER:-}
      WDA_RUNS_KEEP: ${WDA_RUNS_KEEP:-}
      WDA_SESSION_MAX_AGE: ${WDA_SESSION_MAX_AGE:-}
      WDA_SESSION_SECRET: ${WDA_SESSION_SECRET:-}
      WDA_LLM_EFFORT: ${WDA_LLM_EFFORT:-}
      WDA_CACHE_TTL: ${WDA_CACHE_TTL:-}
      WDA_VOCAB_TTL: ${WDA_VOCAB_TTL:-}
      WDA_UPSTREAM_TIMEOUT: ${WDA_UPSTREAM_TIMEOUT:-}
      WDA_UPSTREAM_CONCURRENCY: ${WDA_UPSTREAM_CONCURRENCY:-}
      WDA_SNAPSHOT_PAGE: ${WDA_SNAPSHOT_PAGE:-}
      WDA_OERSI_URL: ${WDA_OERSI_URL:-}
      FORWARDED_ALLOW_IPS: "*"
    # Ohne Domain direkt über einen Port: HOST_PORT=8090 macht die App unter
    # http://<server>:8090 erreichbar. Die Vorgabe bindet nur an den Server selbst.
    ports:
      - "${HOST_PORT:-127.0.0.1:18080}:${WDA_PORT:-8080}"
    volumes:
      - wda-data:/data
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-true}
      - traefik.docker.network=${TRAEFIK_NETWORK:-wlo-data-analysis-web}
      - traefik.http.routers.wlo-data-analysis.rule=Host(`${DOMAIN:-}`)
      - traefik.http.routers.wlo-data-analysis.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.wlo-data-analysis.tls=true
      - traefik.http.routers.wlo-data-analysis.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.wlo-data-analysis.loadbalancer.server.port=${WDA_PORT:-8080}

networks:
  default:
    name: ${TRAEFIK_NETWORK:-wlo-data-analysis-web}

volumes:
  wda-data:
