<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WLO-Daten-Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid;
         place-items: center; background: #f4f6f9; color: #1c2b3a; }
  main { max-width: 34rem; padding: 2rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { line-height: 1.5; }
  code { background: #e4e9f0; padding: .1rem .3rem; border-radius: .25rem; }
</style>
</head>
<body>
<main>
  <h1>WLO-Daten-Dashboard</h1>
  <p>Der Dienst läuft. Die Oberfläche folgt in einem späteren Paket; bis dahin ist
     die Schnittstelle unter <code>/api</code> nach Anmeldung nutzbar.</p>
  <p id="state">Status wird geprüft …</p>
</main>
<script>
  fetch('/api/health').then(r => r.json()).then(d => {
    document.getElementById('state').textContent = 'Version ' + d.version + ', Status ' + d.status + '.';
  }).catch(() => { document.getElementById('state').textContent = 'Schnittstelle nicht erreichbar.'; });
</script>
</body>
</html>
